spring.application.name=production-ready-features
spring.main.banner-mode=off


spring.datasource.url=jdbc:mysql://localhost:3306/prod_ready_features?useSSL=false
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format.sql=true

# devtools

spring.devtools.restart.enabled=true
spring.devtools.restart.exclude=static/**,public/**,resources/**,META-INF/**
spring.devtools.restart.poll-interval=1000
spring.devtools.restart.quiet-period=1000
