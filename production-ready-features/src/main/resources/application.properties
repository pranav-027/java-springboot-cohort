spring.application.name=production-ready-features
spring.main.banner-mode=off


spring.datasource.url=jdbc:mysql://localhost:3306/prod_ready_features?useSSL=false
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format.sql=true

# devtools

spring.devtools.restart.enabled=false
spring.devtools.restart.exclude=static/**,public/**,resources/**,META-INF/**
spring.devtools.restart.poll-interval=2000
spring.devtools.restart.quiet-period=1000


employee.service.base.url=http://localhost:8082/
test.api.service.base.url=https://baconipsum.com/api/
wca.api.url=https://www.worldcubeassociation.org/api/v0/competitions/PuneSpringOpen2026


management.endpoints.web.exposure.include=*
management.info.env.enabled=true
management.info.git.enabled=true
management.info.java.enabled=true
management.info.build.enabled=true
management.info.os.enabled=true

info.creater=Pranav

# logging config
logging.level.sql=trace
logging.level.com.codingshuttle.prav.production_ready_features.clients=TRACE

spring-doc.pacage-to-scan=com.codingshuttle.prav.production_ready_features.controllers,com.codingshuttle.prav.production_ready_features.services,com.codingshuttle.prav.production_ready_features.clients


#logging.client.config=classpath:logback-spring.xml
